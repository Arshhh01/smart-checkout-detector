services:
  - type: web
    name: smart-checkout-detector
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Smart Checkout Detector
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./checkout.db
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://your-app.vercel.app"]'
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: ALERT_COOLDOWN_SECONDS
        value: "5"
    healthCheckPath: /health
    autoDeploy: true
